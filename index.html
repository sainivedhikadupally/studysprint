<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySprint - Student Task Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>StudySprint</h1>
    <p>Plan your day, one task at a time.</p>

    <form>
      <label for="task-input">Enter your task</label>
      <input id="task-input" type="text" placeholder="Enter your task">
      <button type="button">Add Task</button>
    </form>

    <section aria-label="Tasks"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
